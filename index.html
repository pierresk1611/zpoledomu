<body><div id="root"><noscript>Na zobrazenie rodokmeňa povoľte JavaScript.</noscript></div><script id="family-seed" type="application/json">{"version":1,"title":"Ďurišovci","people":[{"id":"P001","firstName":"Peter","lastName":"Ďuriš","birthName":"","gender":"male","birthDate":"1987","deathDate":"","birthPlace":"Zvolen","note":"","source":"Rodinné údaje používateľa (S001–S003); bez nezávislého dokladu.","status":"NEOVERENÉ"},{"id":"P002","firstName":"Viera","lastName":"Ďurišová","birthName":"","gender":"female","birthDate":"1951","deathDate":"","birthPlace":"Zvolenská Slatina","note":"","source":"Rodinné údaje používateľa (S001–S003); bez nezávislého dokladu.","status":"NEOVERENÉ"},{"id":"P003","firstName":"Rudolf","lastName":"Ďuriš","birthName":"","gender":"male","birthDate":"1950-09-12","deathDate":"2013-11-26","birthPlace":"","note":"Rodisko je neisté: používateľ uviedol možno Plzeň. Nájdený náhrobok rodisko neuvádza; jeho údaje nepoužívame na potvrdenie rodného miesta.\nPodľa opraveného údaja používateľa mal Rudolf tri sestry: Ruženu (Praha), Marcelu Solárovú (Bratislava) a Helenu Salinkovú (predtým Malacky). Pôvodný počet štyri bol opravený používateľom (S016).","source":"S008 + S010 + S012 — Cintorín Zvolenská Slatina, hrob 240 (pôvodné číslo 434), záznam z_slatina_z.610; fotografia https://mobec.sk/photos/zvolenska_slatina/408.jpg, prístup 12. 10. 2026. Snímku skontrolovala AI; používateľ potvrdil, že ide o jeho otca.","status":"PODLOŽENÝ ZÁVER"},{"id":"P004","firstName":"Blanka","lastName":"Ďurišová","birthName":"","gender":"female","birthDate":"1982","deathDate":"","birthPlace":"","note":"Adoptovaná Vierou a Rudolfom podľa rodinných údajov. Presné údaje adopcie nie sú doložené.\nS040: Podľa používateľa je slobodná a má dcéru Patríciu. Dcéra sa volá Patrícia Rajčoková; otec zatiaľ nepotvrdený. Slobodný stav nevylučuje partnera.\nS041: Používateľ potvrdil pobyt Blanky Ďurišovej vo Zvolene. Ide o bydlisko, nie potvrdené rodisko.","source":"Rodinné údaje používateľa (S001–S003); bez nezávislého dokladu.\nS037 — Používateľ 13. 10. 2026 výslovne potvrdil priezviská: Patrik Okolenský, Vanesa Okolenská, Ľuboš Baran, Robert Baran, Blanka Ďurišová a Mária Ďurišová. Rodinné podanie; bez nezávislého matričného dokladu.\nS040 — Používateľ 14. 10. 2026 uviedol Máriino priezvisko Ševčíková, manžela Jozefa Ševčíka, deti Tobiasa a Lucasa a Blankinu dcéru Patríciu. Rodinné podanie; bez nezávislého dokladu.","status":"NEOVERENÉ"},{"id":"P005","firstName":"Mária","lastName":"Ševčíková","birthName":"Ďurišová","gender":"female","birthDate":"1983","deathDate":"","birthPlace":"","note":"Adoptovaná Vierou a Rudolfom podľa rodinných údajov. Presné údaje adopcie nie sú doložené.\nS040: Podľa používateľa sa po vydaji volá Ševčíková, manžel je Jozef Ševčík. Jej deti sú Tobias Ševčík a Lucas Ševčík. Jozefovo otcovstvo zatiaľ nebolo výslovne potvrdené.\nS041: Používateľ potvrdil pobyt Márie Ševčíkovej v Hodruši-Hámroch. Ide o bydlisko, nie potvrdené rodisko.","source":"Rodinné údaje používateľa (S001–S003); bez nezávislého dokladu.\nS037 — Používateľ 13. 10. 2026 výslovne potvrdil priezviská: Patrik Okolenský, Vanesa Okolenská, Ľuboš Baran, Robert Baran, Blanka Ďurišová a Mária Ďurišová. Rodinné podanie; bez nezávislého matričného dokladu.\nS040 — Používateľ 14. 10. 2026 uviedol Máriino priezvisko Ševčíková, manžela Jozefa Ševčíka, deti Tobiasa a Lucasa a Blankinu dcéru Patríciu. Rodinné podanie; bez nezávislého dokladu.","status":"NEOVERENÉ"},{"id":"P006","firstName":"Mária","lastName":"Kulichová","birthName":"Gašparíková","gender":"female","birthDate":"1921-10-27","deathDate":"1983-12-08","birthPlace":"","note":"Na náhrobku je uvedené rodné priezvisko Gašparíková. Pôvodné rodinné podanie uvádzalo Gašperíková; variant zachovaný v histórii. Podľa rodinného podania pochádzala z Čierneho Balogu; rodisko zatiaľ nie je doložené matrikou.","source":"S008 + S009 + S011 — Cintorín Zvolenská Slatina, hrob 1549 (pôvodné číslo 676), záznam z_slatina_z.371; fotografia https://mobec.sk/photos/zvolenska_slatina/258.jpg, prístup 12. 10. 2026. Náhrobok vizuálne skontrolovala AI; totožnosť podporilo potvrdenie rodiny.","status":"PODLOŽENÝ ZÁVER"},{"id":"P007","firstName":"Jozef","lastName":"Kulich","birthName":"","gender":"male","birthDate":"1919-10-18","deathDate":"1970-12-16","birthPlace":"Zvolenská Slatina","note":"Dátumy sú čitateľné na spoločnom náhrobku s Máriou Kulichovou. Spoločný hrob sám osebe nedokazuje sobáš; rodičovská väzba k Viere zatiaľ pochádza z rodinného podania.\nS029: Sčítanie 1930, dom 197, domácnosť 3, uvádza Jozefa Kulicha s presným dátumom 18. 10. 1919 a rodiskom Zvolenská Slatina ako syna Márie Kulichovej. V tej istej domácnosti sú jej deti Anna, Ján a Martin. Matkin muž je poznamenaný v Kanade bez mena; otca Jozefa zatiaľ nepoznáme.","source":"S008 + S009 + S011 — Cintorín Zvolenská Slatina, hrob 1549 (pôvodné číslo 676), záznam z_slatina_z.372; fotografia https://mobec.sk/photos/zvolenska_slatina/258.jpg, prístup 12. 10. 2026. Náhrobok vizuálne skontrolovala AI; totožnosť podporilo potvrdenie rodiny.","status":"PODLOŽENÝ ZÁVER"},{"id":"P008","firstName":"Alžbeta","lastName":"Ďurišová","birthName":"Čakanová","gender":"female","birthDate":"1925-01-26","deathDate":"2019-06-12","birthPlace":"","note":"Rodné priezvisko je neisté: Čakanová/Čekanová. Oznámené miesta pobytu: Sobrance, Praha, Plzeň. Roky a rodiská nepoznáme.\nS019–S020: spoločný hrob C/148 v Sobranciach. Náhrobok uvádza Alžbeta rod. Čakanová, *26. 1. 1925, †12. 6. 2019, a označuje ju ako manželku Rudolfa Ďuriša. Pôvodný neistý variant Čekanová zostáva v histórii. Náhrobok skontrolovala AI; rodisko a matričný zápis zatiaľ nepoznáme.","source":"S019 + S020 — Virtuálny cintorín, Sobrance, hrob C/148; https://www.virtualnycintorin.sk/hrob/420333; fotografia https://www.virtualnycintorin.sk/obrazok/hm/FXMzMwNTIzMU8xNzQzNDUx; prístup 12. 10. 2026. Dátumy a nápis manželka prečítané z náhrobku AI; totožnosť je podložený záver z rodinných údajov a hrobu.","status":"PODLOŽENÝ ZÁVER"},{"id":"P009","firstName":"Rudolf","lastName":"Ďuriš","birthName":"","gender":"male","birthDate":"1922-08-10","deathDate":"1986-05-30","birthPlace":"","note":"Oznámené miesta pobytu: Sobrance, Praha, Plzeň. Roky a rodiská nepoznáme. Používateľ potvrdil pochovanie v Sobranciach (S015); životné dátumy a konkrétny hrob zatiaľ nepoznáme.\nS019–S020: hrob C/148 v Sobranciach. Fotografia náhrobku uvádza Rudolf Ďuriš, *10. 8. 1922, †30. 5. 1986, a jeho manželku Alžbetu, rod. Čakanovú. Zhodné meno, miesto pochovania, manželka a rodné priezvisko podporujú identifikáciu rodiny. Náhrobok skontrolovala AI; rodný ani sobášny matričný zápis zatiaľ nebol prečítaný.","source":"S019 + S020 — Virtuálny cintorín, Sobrance, hrob C/148; https://www.virtualnycintorin.sk/hrob/420333; fotografia https://www.virtualnycintorin.sk/obrazok/hm/FXMzMwNTIzMU8xNzQzNDUx; prístup 12. 10. 2026. Dátumy a nápis manželka prečítané z náhrobku AI; totožnosť je podložený záver z rodinných údajov a hrobu.","status":"PODLOŽENÝ ZÁVER"},{"id":"P010","firstName":"Mária","lastName":"Maľová","birthName":"","gender":"female","birthDate":"","deathDate":"","birthPlace":"","note":"Sestra Viery. Podľa používateľa žije vo Zvolenskej Slatine. Dátum narodenia, rodné priezvisko zatiaľ nie sú doložené matrikou. Používateľ potvrdil oboch rodičov (S026): Mária a Jozef Kulichovci.","source":"S014 — Mená a pobyty oznámené používateľom v rozhovore, 12. 10. 2026; bez nezávislého dokladu.","status":"NEOVERENÉ"},{"id":"P011","firstName":"Ružena","lastName":"","birthName":"","gender":"female","birthDate":"","deathDate":"","birthPlace":"","note":"Sestra Rudolfa (1950–2013). Podľa používateľa žije v Prahe. Priezvisko, dátumy zatiaľ nie sú doložené matrikou. Používateľ potvrdil oboch rodičov (S026): Alžbeta a Rudolf Ďurišovci.","source":"S014 — Mená a pobyty oznámené používateľom v rozhovore, 12. 10. 2026; bez nezávislého dokladu.","status":"NEOVERENÉ"},{"id":"P012","firstName":"Marcela","lastName":"Solárová","birthName":"","gender":"female","birthDate":"","deathDate":"","birthPlace":"","note":"Sestra Rudolfa (1950–2013). Oznámený pobyt: Bratislava. Dátumy, životný stav zatiaľ nie sú doložené matrikou. Používateľ potvrdil oboch rodičov (S026): Alžbeta a Rudolf Ďurišovci.","source":"S014 — Mená a pobyty oznámené používateľom v rozhovore, 12. 10. 2026; bez nezávislého dokladu.","status":"NEOVERENÉ"},{"id":"P013","firstName":"Helena","lastName":"Salinková","birthName":"","gender":"female","birthDate":"","deathDate":"","birthPlace":"","note":"Sestra Rudolfa (1950–2013). Podľa používateľa žila v Malackách; tento údaj nepotvrdzuje úmrtie. Dátumy, súčasný pobyt zatiaľ nie sú doložené matrikou. Používateľ potvrdil oboch rodičov (S026): Alžbeta a Rudolf Ďurišovci.\nS033 + S035: Používateľ potvrdil, že manžel Jozef bol lekár, a dcéru Sylviu Offei Kwatya. Rodina ju volala Helena/Hela. Na fotografii spoločného malackého hrobu je Ing. Elena Salinkova (19.5.1949–22.4.1999); podobu Elena v dokladoch používateľ nepozná. Tieto dátumy zatiaľ nie sú prevzaté do profilu Heleny, kým sa potvrdí jej totožnosť.","source":"S014 — Mená a pobyty oznámené používateľom v rozhovore, 12. 10. 2026; bez nezávislého dokladu.","status":"NEOVERENÉ"},{"id":"P014","firstName":"Mária","lastName":"Kulichová","birthName":"","gender":"female","birthDate":"1900","deathDate":"","birthPlace":"Zvolenská Slatina","note":"Prednostka tretej domácnosti v dome 197. Jozef je uvedený ako jej syn; Anna, Ján a Martin ako jej dcéra a synovia. Rodné priezvisko a úmrtie nepoznáme. Hárok uvádza sobáš v roku 1920 a poznámku „muž v Kanade“, bez jeho mena. Meno otca detí ani spoločné otcovstvo z toho neurčujeme.","source":"S029 — Slovenský národný archív, sčítanie 1930, Zvolenská Slatina, dom 197, hárok 1141/132, druhá strana, domácnosť 3; https://slovakiana.sk/scitacie-harky/cair-ko28dhx. Originál vizuálne prečítala AI 13. 10. 2026. Identifikácia cez meno a presný dátum narodenia Jozefa (18. 10. 1919); rodný ani sobášny čov oboch skupín (S026); doplnené rodičovské väzby sú rodinným podaním bez matričného dokladu.","status":"Doplnené rodinné údaje"},{"id":"Q005","title":"Predchádzajúce hľadanie v iných indexoch","detail":"Pred nálezom hrobu C/148: Hľadáme dátumy narodenia a úmrtia Rudolfa Ďuriša staršieho a Alžbety (možno Čakanová/Čekanová). Rodina potvrdila Rudolfovo pochovanie v Sobranciach. Cintoriny.sk: 8 menovcov Rudolf Ďuriš a 15 Alžbiet Ďurišových, detaily 15 záznamov skontrolované; žiadna totožnosť zatiaľ potvrdená. Sobrance neboli nájdené vo vyhľadávaní cintoriny.sk ani v zozname pohrebísk Košického kraja na pohrebiska.sk. Web mesta vyžaduje CAPTCHA. Dátumy starých rodičov zostávajú otvorené.","status":"Prehľadané dostupné indexy · bez potvrdenej zhody"},{"id":"Q006","title":"Rudolf a Alžbeta · hrob C/148","detail":"Na základe výpisu používateľa bol otvorený pôvodný detail aj fotografia: Rudolf 10. 8. 1922 – 30. 5. 1986; Alžbeta, rod. Čakanová, 26. 1. 1925 – 12. 6. 2019. Nápis uvádza manželku. Nasleduje rodný alebo sobášny matričný zápis pre rodiská a rodičov; tieto údaje hrob neposkytuje.","status":"Dátumy a manželstvo podložené náhrobkom"},{"id":"Q007","title":"Rodičia tetiek · doplnené väzby","detail":"Používateľ výslovne potvrdil: Viera a Mária Maľová majú rodičov Máriu a Jozefa Kulichových; Rudolf a tri sestry Ružena, Marcela a Helena majú rodičov Alžbetu a Rudolfa Ďurišových. Pridaných osem rodičovských väzieb s citáciou rodinného podania. Matričný zápis zatiaľ chýba.","status":"Potvrdené používateľom · bez matričného dokladu"},{"id":"Q008","title":"Nová generácia · Jozefova matka","detail":"S029: Originál sčítania 1930 uvádza Jozefa Kulicha nar. 18. 10. 1919 ako syna Márie Kulichovej (1900) v dome 197 Zvolenská Slatina. Pridaná Mária a jej ďalšie deti Anna (1921), Ján (1924), Martin (1926), štyri rodičovské väzby. Identifikácia je podložený záver; rodné priezvisko matky a meno otca zostávajú otvorené.","status":"Podložené originálom sčítania · matrika nasleduje"},{"id":"Q009","title":"Nepriradené stopy · Juraj a Július","detail":"Juraj Ďuriš 1911–1991 v Sobranciach C/25: používateľ ho nepozná; väzba nenájdená. Július Gašparík je sčítací revízor Čierneho Balogu v roku 1930; bez dokladu väzby k Márii Gašparíkovej. Tieto osoby zatiaľ nie sú členmi rodokmeňa.","status":"Stopy bez potvrdeného príbuzenstva"},{"id":"Q010","title":"Ďalší zápis · Jozef 1919 a Mária 1900","detail":"Vyhľadať rodný zápis Jozefa z 18. 10. 1919 v Zvolenskej Slatine a sobáš Márie z 2. 11. 1920 podľa sčítacieho hárku. Jozef sa narodil pred zapísaným sobášom; manžela nemožno automaticky označiť za jeho otca. Zistiť rodné priezvisko Márie, manžela, rodičov a vysvetlenie poznámky o Kanade.","status":"Konkrétne dátumy pre pokračovanie v matrike"},{"id":"Q011","title":"Manželia a deti tetiek","detail":"Viera a Rudolf sú manželia podľa používateľa (S030). Mária Maľová + Pavel Maľa: dcéry Marianna Okolenská a Denisa Baranová. Ružena + Pavel (priezvisko nezistené): syn Pavel P024 podľa opravy S036. Marcela + Jozef Solár; Helena + Jozef Salinka: dcéra Sylvia Offei Kwatya. Ďalšie deti zatiaľ nezistené.","status":"Doplnené rodinné podanie · ďalšie deti hľadáme"},{"id":"Q012","title":"Hľadanie detí Ruženy, Marcely a Heleny","detail":"S032–S035: Používateľ potvrdil lekára Jozefa Salinku a ich dcéru Sylviu Offei Kwatya. Zhoda mena, povolania a Malaciek podporuje priradenie MUDr. Jozefa (3.1.1949–19.12.2022). Na staršej fotografii je Ing. Elena (19.5.1949–22.4.1999); rodina pozná Helenu/Helu a dokladové meno Elena nepotvrdila. Helenine dátumy zostávajú nevyplnené. Verejná kronika neuvádza deti; Sylvia je rodinné podanie. Syn Ruženy a Pavla je Pavel P024 (oprava používateľa S036). Ďalšie deti tohto páru, Ruženy a Marcely zatiaľ nezistené.","status":"Sylvia doplnená · Jozef podložený záver · Elena/Helena otvorené"},{"id":"Q013","title":"Rodiny Marianny a Denisy","detail":"Marianna + Juraj Okolenský žijú podľa používateľa vo Veľkej Čalomiji. Patrik a Vanesa sú oznámené Mariannine deti; otec zatiaľ nepotvrdený. Denisa + Ľuboš Baran majú synov Ľuboša a Roberta. Rovnomenní otcovia a synovia sú samostatné osoby; priezviská detí následne výslovne potvrdil používateľ (S037), dátumy zatiaľ neboli oznámené.","status":"Doplnené rodinné podanie S034"},{"id":"Q014","title":"Helena / Elena a Sylvia","detail":"Rodina uviedla dcéru Sylviu Offei Kwatya, vydatú v UK, a potvrdila, že otec bol lekár. Meno a dátumy Ing. Eleny Salinkovej z malackého náhrobku treba porovnať s dokladom Heleny. Meno manžela Sylvie a ďalší súrodenci nezistení.","status":"Doplnená dcéra · meno matky v dokladoch otvorené"},{"id":"Q015","title":"Nové pátranie · rodné priezviská tetiek","detail":"13. 10. 2026: sedem konkrétnych anonymných dotazov verejného indexu Cintoriny.sk. Malacky + Salink: Jozef 1949–2022 a Elena 1949–1999. Rodné priezvisko Ďuriš + Elena: 2 záznamy, Helena: 12 vrátane Ďurišinová, Ružena: 0, Marcela: 0; žiadny záznam neprepája Helenu s Elenou Salinkovou. Bratislava + Solár + Jozef: dvaja menovci 1904–1965 a 1913–nezistené, bez dôkazu väzby k Marcele. Veľká Čalomija + Okolensk: 0. Index je neúplný; počet výsledkov nepreukazuje životný stav ani nepríbuznosť. Nové osoby nepripojené. Ruženin manžel a syn majú zatiaľ nezistené priezvisko. Celé meno Sylvie a kombinácie mien tetiek vo všeobecnom vyhľadávaní neposkytli použiteľnú novú väzbu. Podrobnosti a hranice hľadania sú vo výskumnej správe na GitHube.","status":"Preverené indexy · ďalšia rodinná väzba zatiaľ nedoložená"},{"id":"Q016","title":"Rodiny sestier Márie a Blanky","detail":"S039–S040: Mária Ševčíková P005, rod. Ďurišová, má manžela Jozefa Ševčíka P032 a deti Tobiasa Ševčíka P033 a Lucasa Ševčíka P034. Blanka Ďurišová P004 je slobodná a má dcéru Patríciu Rajčokovú P035. Priezviská detí potvrdil používateľ (S042); dátumy a otcovstvo zatiaľ nepotvrdené. Údaje sú rodinné podanie.","status":"Mená doplnené používateľom · nezávislé overenie otvorené"}],"sources":[{"id":"S004","title":"Matrika Zvolenská Slatina","url":"https://www.zvolenskaslatina.sk/urad/matrika/","note":"Obec uvádza vydávanie výpisov členom rodiny. Podklad pre získanie dokladu Viery; nevideli sme jej zápis.","checked":"2026-10-12"},{"id":"S005","title":"Banská Bystrica · zbierky matrík","url":"https://www.minv.sk/?zoznam-zbierok","note":"Overený zoznam uvádza Zbierku cirkevných matrík (1377) a zbierky prvopisov i druhopisov v pracovisku Zvolen. Rozsah konkrétnej knihy a signatúra zatiaľ nezistené.","checked":"2026-10-12"},{"id":"S006","title":"Archív Michalovce · územná pôsobnosť","url":"https://www.minv.sk/?sake-pmi-uzemna-posobnost","note":"Oficiálna stránka výslovne uvádza okresy Michalovce a Sobrance. Pôsobnosť nenahrádza zistenie konkrétneho fondu.","checked":"2026-10-12"},{"id":"S007","title":"Archív Michalovce · zachované dokumenty","url":"https://www.minv.sk/?sake-pmi-ake-dokumenty-u-nas-najdete","note":"Prehľad uvádza štátne matriky 1895–1906/1914 vo fondoch notárskych úradov a povojnové fondy národných výborov. Konkrétna kniha alebo spis rodiny ešte neboli čítané.","checked":"2026-10-12"},{"id":"S008","title":"Cintorín Zvolenská Slatina · verejný index","url":"https://mobec.sk/zvolenskaslatina#cintorin","note":"Prehľadaný index zosnulých: prefix Kulich 58 záznamov, Ďuriš 5, Gašperík 0. Relevantné záznamy .371, .372 a .610 skontrolované aj na fotografiách náhrobkov. Rodné priezviská treba hľadať oddelene od súčasného priezviska.","checked":"2026-10-12"},{"id":"S009","title":"Náhrobok Márie a Jozefa Kulichových","url":"https://mobec.sk/photos/zvolenska_slatina/258.jpg","note":"Hrob 1549, pôvodné číslo 676. AI prečítala mená, rodné priezvisko Gašparíková a životné dátumy; rodina potvrdila zhodu úmrtí. Nie je to rodný ani sobášny matričný zápis.","checked":"2026-10-12"},{"id":"S010","title":"Náhrobok Rudolfa Ďuriša","url":"https://mobec.sk/photos/zvolenska_slatina/408.jpg","note":"Hrob 240, pôvodné číslo 434. Index uvádza narodenie 12. 9. 1950 a úmrtie 26. 11. 2013; fotografia zodpovedá údajom a používateľ výslovne potvrdil totožnosť otca.","checked":"2026-10-12"},{"id":"S017","title":"Cintoriny.sk · hľadanie otcových rodičov","url":"https://www.cintoriny.sk/src/index.php","note":"Verejné hľadanie: Rudolf Ďuriš 8, Alžbeta Ďurišová 15; prečítané detaily všetkých 15 Alžbiet. Rodné priezvisko Čakanová 0, Čekanová 1 (Sabinov). Žiadny záznam zatiaľ neidentifikovaný ako príbuzný. Hľadanie cintorína Sobrance bez výsledku je limitom tohto portálu.","checked":"2026-10-12"},{"id":"S018","title":"Pohrebiska.sk · zoznam Košického kraja","url":"https://www.pohrebiska.sk/vyhladanie_sk_kraj_ma.jsp?kraj=KE","note":"Prečítaný zoznam evidovaných pohrebísk; Sobrance v zozname nie sú. Nejde o dôkaz, že Rudolf v Sobranciach nie je pochovaný. Osobné záznamy pre Sobrance tu neboli dostupné.","checked":"2026-10-12"},{"id":"S019","title":"Rudolf a Alžbeta Ďurišovci · hrob C/148","url":"https://www.virtualnycintorin.sk/hrob/420333","note":"Detail hrobu skutočne prečítaný: Rudolf †30. 5. 1986, Alžbeta †12. 6. 2019. Používateľ dodal stopu a potvrdil Rudolfovo pochovanie v Sobranciach; fotografia uvádza narodenia a rodné priezvisko.","checked":"2026-10-12"},{"id":"S020","title":"Náhrobok Rudolfa a Alžbety · dátumy a Čakanová","url":"https://www.virtualnycintorin.sk/obrazok/hm/FXMzMwNTIzMU8xNzQzNDUx","note":"AI prečítala Rudolf *10. 8. 1922 †30. 5. 1986; „a manželka Alžbeta rod. Čakanová“ *26. 1. 1925 †12. 6. 2019. Ide o náhrobok, nie rodný ani sobášny matričný zápis.","checked":"2026-10-12"},{"id":"S021","title":"Juraj Ďuriš · nepriradený hrob C/25","url":"https://www.virtualnycintorin.sk/hrob/420210","note":"Náhrobok uvádza 1911–1991. Používateľ Juraja nepozná; nebol pridaný do rodiny. Rovnaké priezvisko a cintorín nedokazujú príbuzenstvo.","checked":"2026-10-13"},{"id":"S022","title":"Juraj Ďuriš · fotografia náhrobku","url":"https://www.virtualnycintorin.sk/obrazok/hm/FXMjM4NTEzMU8xNTQwNDUx","note":"Pôvodná fotografia prečítaná AI: 1911–1991; žiadny nápis dokladajúci väzbu k Rudolfovi.","checked":"2026-10-13"},{"id":"S024","title":"Cintoriny.sk · Jozef Kulich","url":"https://www.cintoriny.sk/src/index.php","note":"Verejný index vrátil 20 menovcov Jozef Kulich. Zodpovedajúci dátum 18. 10. 1919 / 16. 12. 1970 nezistený; Detva 23. 10. 1919 – 20. 3. 1999 je iný muž.","checked":"2026-10-13"},{"id":"S025","title":"Praha · starý súpis obyvateľov","url":"https://katalog.ahmp.cz/pragapublica/","note":"V zbierke Soupis pražského obyvatelstva 1830–1910 (1920), xid 59F886CC3AA211E0824A00166F1163D4, dotazy Ďuriš, Duriš, Čakan a Kulich vrátili 0. Kontrolný prázdny dotaz zobrazil 270174 položiek. Nevylučuje neskorší pobyt rodiny v Prahe; osobná snímka nebola získaná.","checked":"2026-10-13"},{"id":"S027","title":"Čierny Balog 1930 · Július Gašparík","url":"https://slovakiana.sk/scitacie-harky/cair-ko26xh3","note":"Hárok 1186/138 je obecný prehľad; Július Gašparík je uvedený ako sčítací revízor. Nie je doložený jeho vzťah k Márii Gašparíkovej. Katalóg obce má 903 položiek, nie 903 prečítaných rodinných hárkov.","checked":"2026-10-13"},{"id":"S028","title":"Pozor na zaradenie · originál hárku Slatinky","url":"https://slovakiana.sk/scitacie-harky/cair-ko29ung","note":"Katalóg označuje 1257/75 ako Zvolenskú Slatinu, ale originál výslovne uvádza Slatinku. Výskum musí overovať obec na snímke. Dom 5 Slatinky (1141/326) neobsahuje hľadaného Jozefa 1919.","checked":"2026-10-13"},{"id":"S029","title":"Jozefova matka a súrodenci · sčítanie 1930","url":"https://slovakiana.sk/scitacie-harky/cair-ko28dhx","note":"Originál hárku 1141/132, druhá strana: domácnosť 3, dom 197 Zvolenská Slatina. Mária Kulichová (1900), prednostka; Jozef, syn, 18. 10. 1919; Anna, dcéra, 1921; Ján, syn, 1924; Martin, syn, 1926. Rodisko pri všetkých Zvolenská Slatina. Zhoda Jozefovho mena a celého dátumu narodenia podporuje identifikáciu s P007. Poznámka „muž v Kanade“ neuvádza otca menom. Nie je to matričný zápis.","checked":"2026-10-13"},{"id":"S032","title":"Hľadanie rodín tetiek · verejné indexy","url":"https://www.cintoriny.sk/src/index.php","note":"Cintoriny.sk: Helena Salinková 0, Marcela Solárová 0; Jozef Solár 12 výsledkov vrátane prefixových zhôd; Salinka 4 záznamy. Bez potvrdených mien ďalších detí. Virtuálny cintorín: Salinka Komárno 3 v jednom hrobe, Salinková 0. Bing vracal nesúvisiace výsledky a nepoužíva sa ako dôkaz neprítomnosti rodiny.","checked":"2026-10-13"},{"id":"S033","title":"Malacky · MUDr. Jozef a Ing. Elena Salinkovci","url":"https://www.cintoriny.sk/src/index.php?cintorinId=1198&hrobId=1198000618","note":"Karta hrobu1198000618: MUDr. Jozef Salinka 3.1.1949–19.12.2022 a Ing. Elena Salinkova 19.5.1949–22.4.1999. Rodina následne potvrdila, že Helenin manžel bol lekár, čo s menom a Malackami podporuje identifikáciu Jozefa. Fotografia uvádza len Elenu; Helena/Elena ostáva nevyjasnené a jej dátumy neboli prebraté do profilu. Verejná kronika neuvádza deti; Sylvia je osobitné rodinné podanie S035.","checked":"2026-10-13"},{"id":"S036","title":"Oprava Pavlových rodičov · otcova vetva","url":"https://github.com/pierresk1611/zpoledomu/blob/main/docs/manzelia-a-deti.md","note":"S036 — Používateľ 13. 10. 2026 opravil zaradenie Pavla P024: syn Ruženy P011 a jej manžela Pavla P019, otcova vetva. Rodinné podanie; bez nezávislého matričného dokladu.","checked":"2026-10-13"},{"id":"S037","title":"Potvrdené priezviská detí a sestier","url":"https://github.com/pierresk1611/zpoledomu/blob/main/docs/manzelia-a-deti.md","note":"S037 — Používateľ 13. 10. 2026 výslovne potvrdil priezviská: Patrik Okolenský, Vanesa Okolenská, Ľuboš Baran, Robert Baran, Blanka Ďurišová a Mária Ďurišová. Rodinné podanie; bez nezávislého matričného dokladu.","checked":"2026-10-13"},{"id":"S038","title":"Nové hľadanie rodín tetiek · rodné priezviská a lokality","url":"https://www.cintoriny.sk/src/index.php?simpleSearch&type=1&city=Malacky&surname=Salink","note":"13. 10. 2026: sedem konkrétnych anonymných dotazov verejného indexu Cintoriny.sk. Malacky + Salink: Jozef 1949–2022 a Elena 1949–1999. Rodné priezvisko Ďuriš + Elena: 2 záznamy, Helena: 12 vrátane Ďurišinová, Ružena: 0, Marcela: 0; žiadny záznam neprepája Helenu s Elenou Salinkovou. Bratislava + Solár + Jozef: dvaja menovci 1904–1965 a 1913–nezistené, bez dôkazu väzby k Marcele. Veľká Čalomija + Okolensk: 0. Index je neúplný; počet výsledkov nepreukazuje životný stav ani nepríbuznosť. Nové osoby nepripojené.","checked":"2026-10-13"},{"id":"S039","title":"Rodiny sestier Márie a Blanky · rodinné podanie","url":"https://github.com/pierresk1611/zpoledomu/blob/main/docs/rodiny-sestier.md","note":"Používateľ 14. 10. 2026 uviedol: sestra Mária je vydatá a má dve deti; sestra Blanka je slobodná a má dcéru. Mená manžela a detí, Máriino priezvisko po vydaji, dátumy a otcovstvo detí zatiaľ neboli uvedené. Ide o rodinné podanie, nie nezávislé overenie.","checked":"2026-10-14"},{"id":"S040","title":"Mená manžela a detí sestier","url":"https://github.com/pierresk1611/zpoledomu/blob/main/docs/rodiny-sestier.md","note":"S040 — Používateľ 14. 10. 2026 uviedol Máriino priezvisko Ševčíková, manžela Jozefa Ševčíka, deti Tobiasa a Lucasa a Blankinu dcéru Patríciu. Rodinné podanie; bez nezávislého dokladu.","checked":"2026-10-14"},{"id":"S041","title":"Bydliská sestier · rodinné podanie","url":"https://github.com/pierresk1611/zpoledomu/blob/main/docs/rodiny-sestier.md","note":"Používateľ 14. 10. 2026 uviedol, že Mária žije v Hodruši-Hámroch a Blanka vo Zvolene. Obce pobytu nie sú dôkazom rodiska.","checked":"2026-10-14"},{"id":"S042","title":"Priezviská detí sestier · potvrdené používateľom","url":"https://github.com/pierresk1611/zpoledomu/blob/main/docs/rodiny-sestier.md","note":"S042 — Používateľ potvrdil priezviská: Patrícia Rajčoková, Tobias Ševčík a Lucas Ševčík. Rodinné podanie; bez nezávislého dokladu.","checked":"2026-10-14"}],"seedRevision":10}</script><script>(function(){"use strict";function B0(s){return s&&s.__esModule&&Object.prototype.hasOwnProperty.call(s,"default")?s.default:s}var $i={ex thPlace":"Zvolenská Slatina","note":"","source":"Rodinné údaje používateľa (S001–S003); bez nezávislého dokladu.","status":"NEOVERENÉ"},{"id":"P003","firstName":"Rudolf","lastName":"Ďuriš","birthName":"","gender":"male","birthDate":"1950-09-12","deathDate":"2013-11-26","birthPlace":"","note":"Rodisko je neisté: používateľ uviedol možno Plzeň. Nájdený náhrobok rodisko neuvádza; jeho údaje nepoužívame na potvrdenie rodného miesta.\\nPodľa opraveného údaja používateľa mal Rudolf tri sestry: Ruženu (Praha), Marcelu Solárovú (Bratislava) a Helenu Salinkovú (predtým Malacky). Pôvodný počet štyri bol opravený používateľom (S016).","source":"S008 + S010 + S012 — Cintorín Zvolenská Slatina, hrob 240 (pôvodné číslo 434), záznam z_slatina_z.610; fotografia https://mobec.sk/photos/zvolenska_slatina/408.jpg, prístup 12. 10. 2026. Snímku skontrolovala AI; používateľ potvrdil, že ide o jeho otca.","status":"PODLOŽENÝ ZÁVER"},{"id":"P004","firstName":"Blanka","lastName":"Ďurišová","birthName":"","gender":"female","birthDate":"1982","deathDate":"","birthPlace":"","note":"Adoptovaná Vierou a Rudolfom podľa rodinných údajov. Presné údaje adopcie nie sú doložené.\\nS040: Podľa používateľa je slobodná a má dcéru Patríciu. Dcéra sa volá Patrícia Rajčoková; otec zatiaľ nepotvrdený. Slobodný stav nevylučuje partnera.\\nS041: Používateľ potvrdil pobyt Blanky Ďurišovej vo Zvolene. Ide o bydlisko, nie potvrdené rodisko.","source":"Rodinné údaje používateľa (S001–S003); bez nezávislého dokladu.\\nS037 — Používateľ 13. 10. 2026 výslovne potvrdil priezviská: Patrik Okolenský, Vanesa Okolenská, Ľuboš Baran, Robert Baran, Blanka Ďurišová a Mária Ďurišová. Rodinné podanie; bez nezávislého matričného dokladu.\\nS040 — Používateľ 14. 10. 2026 uviedol Máriino priezvisko Ševčíková, manžela Jozefa Ševčíka, deti Tobiasa a Lucasa a Blankinu dcéru Patríciu. Rodinné podanie; bez nezávislého dokladu.","status":"NEOVERENÉ"},{"id":"P005","firstName":"Mária","lastName":"Ševčíková","birthName":"Ďurišová","gender":"female","birthDate":"1983","deathDate":"","birthPlace":"","note":"Adoptovaná Vierou a Rudolfom podľa rodinných údajov. Presné údaje adopcie nie sú doložené.\\nS040: Podľa používateľa sa po vydaji volá Ševčíková, manžel je Jozef Ševčík. Jej deti sú Tobias Ševčík a Lucas Ševčík. Jozefovo otcovstvo zatiaľ nebolo výslovne potvrdené.\\nS041: Používateľ potvrdil pobyt Márie Ševčíkovej v Hodruši-Hámroch. Ide o bydlisko, nie potvrdené rodisko.","source":"Rodinné údaje používateľa (S001–S003); bez nezávislého dokladu.\\nS037 — Používateľ 13. 10. 2026 výslovne potvrdil priezviská: Patrik Okolenský, Vanesa Okolenská, Ľuboš Baran, Robert Baran, Blanka Ďurišová a Mária Ďurišová. Rodinné podanie; bez nezávislého matričného dokladu.\\nS040 — Používateľ 14. 10. 2026 uviedol Máriino priezvisko Ševčíková, manžela Jozefa Ševčíka, deti Tobiasa a Lucasa a Blankinu dcéru Patríciu. Rodinné podanie; bez nezávislého dokladu.","status":"NEOVERENÉ"},{"id":"P006","firstName":"Mária","lastName":"Kulichová","birthName":"Gašparíková","gender":"female","birthDate":"1921-10-27","deathDate":"1983-12-08","birthPlace":"","note":"Na náhrobku je uvedené rodné priezvisko Gašparíková. Pôvodné rodinné podanie uvádzalo Gašperíková; variant zachovaný v histórii. Podľa rodinného podania pochádzala z Čierneho Balogu; rodisko zatiaľ nie je doložené matrikou.","source":"S008 + S009 + S011 — Cintorín Zvolenská Slatina, hrob 1549 (pôvodné číslo 676), záznam z_slatina_z.371; fotografia https://mobec.sk/photos/zvolenska_slatina/258.jpg, prístup 12. 10. 2026. Náhrobok vizuálne skontrolovala AI; totožnosť podporilo potvrdenie rodiny.","status":"PODLOŽENÝ ZÁVER"},{"id":"P007","firstName":"Jozef","lastName":"Kulich","birthName":"","gender":"male","birthDate":"1919-10-18","deathDate":"1970-12-16","birthPlace":"Zvolenská Slatina","note":"Dátumy sú čitateľné na spoločnom náhrobku s Máriou Kulichovou. Spoločný hrob sám osebe nedokazuje sobáš; rodičovská väzba k Viere zatiaľ pochádza z rodinného podania.\\nS029: Sčítanie 1930, dom 197, domácnosť 3, uvádza Jozefa Kulicha s presným dátumom 18. 10. 1919 a rodiskom Zvolenská Slatina ako syna Márie Kulichovej. V tej istej domácnosti sú jej deti Anna, Ján a Martin. Matkin muž je poznamenaný v Kanade bez mena; otca Jozefa zatiaľ nepoznáme.","source":"S008 + S009 + S011 — Cintorín Zvolenská Slatina, hrob 1549 (pôvodné číslo 676), záznam z_slatina_z.372; fotografia https://mobec.sk/photos/zvolenska_slatina/258.jpg, prístup 12. 10. 2026. Náhrobok vizuálne skontrolovala AI; totožnosť podporilo potvrdenie rodiny.","status":"PODLOŽENÝ ZÁVER"},{"id":"P008","firstName":"Alžbeta","lastName":"Ďurišová","birthName":"Čakanová","gender":"female","birthDate":"1925-01-26","deathDate":"2019-06-12","birthPlace":"","note":"Rodné priezvisko je neisté: Čakanová/Čekanová. Oznámené miesta pobytu: Sobrance, Praha, Plzeň. Roky a rodiská nepoznáme.\\nS019–S020: spoločný hrob C/148 v Sobranciach. Náhrobok uvádza Alžbeta rod. Čakanová, *26. 1. 1925, †12. 6. 2019, a označuje ju ako manželku Rudolfa Ďuriša. Pôvodný neistý variant Čekanová zostáva v histórii. Náhrobok skontrolovala AI; rodisko a matričný zápis zatiaľ nepoznáme.","source":"S019 + S020 — Virtuálny cintorín, Sobrance, hrob C/148; https://www.virtualnycintorin.sk/hrob/420333; fotografia https://www.virtualnycintorin.sk/obrazok/hm/FXMzMwNTIzMU8xNzQzNDUx; prístup 12. 10. 2026. Dátumy a nápis manželka prečítané z náhrobku AI; totožnosť je podložený záver z rodinných údajov a hrobu.","status":"PODLOŽENÝ ZÁVER"},{"id":"P009","firstName":"Rudolf","lastName":"Ďuriš","birthName":"","gender":"male","birthDate":"1922-08-10","deathDate":"1986-05-30","birthPlace":"","note":"Oznámené miesta pobytu: Sobrance, Praha, Plzeň. Roky a rodiská nepoznáme. Používateľ potvrdil pochovanie v Sobranciach (S015); životné dátumy a konkrétny hrob zatiaľ nepoznáme.\\nS019–S020: hrob C/148 v Sobranciach. Fotografia náhrobku uvádza Rudolf Ďuriš, *10. 8. 1922, †30. 5. 1986, a jeho manželku Alžbetu, rod. Čakanovú. Zhodné meno, miesto pochovania, manželka a rodné priezvisko podporujú identifikáciu rodiny. Náhrobok skontrolovala AI; rodný ani sobášny matričný zápis zatiaľ nebol prečítaný.","source":"S019 + S020 — Virtuálny cintorín, Sobrance, hrob C/148; https://www.virtualnycintorin.sk/hrob/420333; fotografia https://www.virtualnycintorin.sk/obrazok/hm/FXMzMwNTIzMU8xNzQzNDUx; prístup 12. 10. 2026. Dátumy a nápis manželka prečítané z náhrobku AI; totožnosť je podložený záver z rodinných údajov a hrobu.","status":"PODLOŽENÝ ZÁVER"},{"id":"P010","firstName":"Mária","lastName":"Maľová","birthName":"","gender":"female","birthDate":"","deathDate":"","birthPlace":"","note":"Sestra Viery. Podľa používateľa žije vo Zvolenskej Slatine. Dátum narodenia, rodné priezvisko zatiaľ nie sú doložené matrikou. Používateľ potvrdil oboch rodičov (S026): Mária a Jozef Kulichovci.","source":"S014 — Mená a pobyty oznámené používateľom v rozhovore, 12. 10. 2026; bez nezávislého dokladu.","status":"NEOVERENÉ"},{"id":"P011","firstName":"Ružena","lastName":"","birthName":"","gender":"female","birthDate":"","deathDate":"","birthPlace":"","note":"Sestra Rudolfa (1950–2013). Podľa používateľa žije v Prahe. Priezvisko, dátumy zatiaľ nie sú doložené matrikou. Používateľ potvrdil oboch rodičov (S026): Alžbeta a Rudolf Ďurišovci.","source":"S014 — Mená a pobyty oznámené používateľom v rozhovore, 12. 10. 2026; bez nezávislého dokladu.","status":"NEOVERENÉ"},{"id":"P012","firstName":"Marcela","lastName":"Solárová","birthName":"","gender":"female","birthDate":"","deathDate":"","birthPlace":"","note":"Sestra Rudolfa (1950–2013). Oznámený pobyt: Bratislava. Dátumy, životný stav zatiaľ nie sú doložené matrikou. Používateľ potvrdil oboch rodičov (S026): Alžbeta a Rudolf Ďurišovci.","source":"S014 — Mená a pobyty oznámené používateľom v rozhovore, 12. 10. 2026; bez nezávislého dokladu.","status":"NEOVERENÉ"},{"id":"P013","firstName":"Helena","lastName":"Salinková","birthName":"","gender":"female","birthDate":"","deathDate":"","birthPlace":"","note":"Sestra Rudolfa (1950–2013). Podľa používateľa žila v Malackách; tento údaj nepotvrdzuje úmrtie. Dátumy, súčasný pobyt zatiaľ nie sú doložené matrikou. Používateľ potvrdil oboch rodičov (S026): Alžbeta a Rudolf Ďurišovci.\\nS033 + S035: Používateľ potvrdil, že manžel Jozef bol lekár, a dcéru Sylviu Offei Kwatya. Rodina ju volala Helena/Hela. Na fotografii spoločného malackého hrobu je Ing. Elena Salinkova (19.5.1949–22.4.1999); podobu Elena v dokladoch používateľ nepozná. Tieto dátumy zatiaľ nie sú prevzaté do profilu Heleny, kým sa potvrdí jej totožnosť.","source":"S014 — Mená a pobyty oznámené používateľom v rozhovore, 12. 10. 2026; bez nezávislého dokladu.","status":"NEOVERENÉ"},{"id":"P014","firstName":"Mária","lastName":"Kulichová","birthName":"","gender":"female","birthDate":"1900","deathDate":"","birthPlace":"Zvolenská Slatina","note":"Prednostka tretej domácnosti v dome 197. Jozef je uvedený ako jej syn; Anna, Ján a Martin ako jej dcéra a synovia. Rodné priezvisko a úmrtie nepoznáme. Hárok uvádza sobáš v roku 1920 a poznámku „muž v Kanade“, bez jeho mena. Meno otca detí ani spoločné otcovstvo z toho neurčujeme.","source":"S029 — Slovenský národný archív, sčítanie 1930, Zvolenská Slatina, dom 197, hárok 1141/132, druhá strana, domácnosť 3; https://slovakiana.sk/scitacie-harky/cair-ko28dhx. Originál vizuálne prečítala AI 13. 10. 2026. Identifikácia cez meno a presný dátum narodenia Jozefa (18. 10. 1919); rodný ani sobášny zápis zatiaľ nebol prečítaný.","status":"PODLOŽENÝ ZÁVER"},{"id":"P015","firstName":"Anna","lastName":"Kulichová","birthName":"","gender":"female","birthDate":"1921","deathDate":"","birthPlace":"Zvolenská Slatina","note":"V sčítaní 1930 dcéra Márie Kulichovej v domácnosti 3, dome 197. Súrodenecký vzťah k Jozefovi je podložený spoločnou matkou v zázname; otec, neskoršie priezvisko a úmrtie zatiaľ nezistené.","source":"S029 — Slovenský národný archív, sčítanie 1930, Zvolenská Slatina, dom 197, hárok 1141/132, druhá strana, domácnosť 3; ht odľa presného dátumu narodenia, náhrobku a potvrdenia syna. Rodisko Plzeň aj rodné priezvisko Alžbety Čakanová/Čekanová ostávajú neisté. Predkov Rudolfa zatiaľ dokladá rodinné podanie.",status:"Totožnosť otca potvrdená"},{id:"Q003",title:"Adoptívne väzby sestier",detail:"Mária: opravený rok 1983. Obe sestry adoptovali Viera a Rudolf, odhadom v rokoch 1986/1987. Biologickí rodičia zatiaľ nie sú uvedení.",status:"Doplnené používateľom"},{id:"Q004",title:"Súrodenci rodičov",detail:"Rudolf mal tri sestry: Ruženu, Marcelu Solárovú a Helenu Salinkovú; Viera má sestru Máriu Maľovú. Používateľ 13. 10. 2026 potvrdil oboch rodičov oboch skupín (S026); doplnené rodičovské väzby sú rodinným podaním bez matričného dokladu.",status:"Doplnené rodinné údaje"},{id:"Q005",title:"Predchádzajúce hľadanie v iných indexoch",detail:"Pred nálezom hrobu C/148: Hľadáme dátumy narodenia a úmrtia Rudolfa Ďuriša staršieho a Alžbety (možno Čakanová/Čekanová). Rodina potvrdila Rudolfovo pochovanie v Sobranciach. Cintoriny.sk: 8 menovcov Rudolf Ďuriš a 15 Alžbiet Ďurišových, detaily 15 záznamov skontrolované; žiadna totožnosť zatiaľ potvrdená. Sobrance neboli nájdené vo vyhľadávaní cintoriny.sk ani v zozname pohrebísk Košického kraja na pohrebiska.sk. Web mesta vyžaduje CAPTCHA. Dátumy starých rodičov zostávajú otvorené.",status:"Prehľadané dostupné indexy · bez potvrdenej zhody"},{id:"Q006",title:"Rudolf a Alžbeta · hrob C/148",detail:"Na základe výpisu používateľa bol otvorený pôvodný detail aj fotografia: Rudolf 10. 8. 1922 – 30. 5. 1986; Alžbeta, rod. Čakanová, 26. 1. 1925 – 12. 6. 2019. Nápis uvádza manželku. Nasleduje rodný alebo sobášny matričný zápis pre rodiská a rodičov; tieto údaje hrob neposkytuje.",status:"Dátumy a manželstvo podložené náhrobkom"},{id:"Q007",title:"Rodičia tetiek · doplnené väzby",detail:"Používateľ výslovne potvrdil: Viera a Mária Maľová majú rodičov Máriu a Jozefa Kulichových; Rudolf a tri sestry Ružena, Marcela a Helena majú rodičov Alžbetu a Rudolfa Ďurišových. Pridaných osem rodičovských väzieb s citáciou rodinného podania. Matričný zápis zatiaľ chýba.",status:"Potvrdené používateľom · bez matričného dokladu"},{id:"Q008",title:"Nová generácia · Jozefova matka",detail:"S029: Originál sčítania 1930 uvádza Jozefa Kulicha nar. 18. 10. 1919 ako syna Márie Kulichovej (1900) v dome 197 Zvolenská Slatina. Pridaná Mária a jej ďalšie deti Anna (1921), Ján (1924), Martin (1926), štyri rodičovské väzby. Identifikácia je podložený záver; rodné priezvisko matky a meno otca zostávajú otvorené.",status:"Podložené originálom sčítania · matrika nasleduje"},{id:"Q009",title:"Nepriradené stopy · Juraj a Július",detail:"Juraj Ďuriš 1911–1991 v Sobranciach C/25: používateľ ho nepozná; väzba nenájdená. Július Gašparík je sčítací revízor Čierneho Balogu v roku 1930; bez dokladu väzby k Márii Gašparíkovej. Tieto osoby zatiaľ nie sú členmi rodokmeňa.",status:"Stopy bez potvrdeného príbuzenstva"},{id:"Q010",title:"Ďalší zápis · Jozef 1919 a Mária 1900",detail:"Vyhľadať rodný zápis Jozefa z 18. 10. 1919 v Zvolenskej Slatine a sobáš Márie z 2. 11. 1920 podľa sčítacieho hárku. Jozef sa narodil pred zapísaným sobášom; manžela nemožno automaticky označiť za jeho otca. Zistiť rodné priezvisko Márie, manžela, rodičov a vysvetlenie poznámky o Kanade.",status:"Konkrétne dátumy pre pokračovanie v matrike"},{id:"Q011",title:"Manželia a deti tetiek",detail:"Viera a Rudolf sú manželia podľa používateľa (S030). Mária Maľová + Pavel Maľa: dcéry Marianna Okolenská a Denisa Baranová. Ružena + Pavel (priezvisko nezistené): syn Pavel P024 podľa opravy S036. Marcela + Jozef Solár; Helena + Jozef Salinka: dcéra Sylvia Offei Kwatya. Ďalšie deti zatiaľ nezistené.",status:"Doplnené rodinné podanie · ďalšie deti hľadáme"},{id:"Q012",title:"Hľadanie detí Ruženy, Marcely a Heleny",detail:"S032–S035: Používateľ potvrdil lekára Jozefa Salinku a ich dcéru Sylviu Offei Kwatya. Zhoda mena, povolania a Malaciek podporuje priradenie MUDr. Jozefa (3.1.1949–19.12.2022). Na staršej fotografii je Ing. Elena (19.5.1949–22.4.1999); rodina pozná Helenu/Helu a dokladové meno Elena nepotvrdila. Helenine dátumy zostávajú nevyplnené. Verejná kronika neuvádza deti; Sylvia je rodinné podanie. Syn Ruženy a Pavla je Pavel P024 (oprava používateľa S036). Ďalšie deti tohto páru, Ruženy a Marcely zatiaľ nezistené.",status:"Sylvia doplnená · Jozef podložený záver · Elena/Helena otvorené"},{id:"Q013",title:"Rodiny Marianny a Denisy",detail:"Marianna + Juraj Okolenský žijú podľa používateľa vo Veľkej Čalomiji. Patrik a Vanesa sú oznámené Mariannine deti; otec zatiaľ nepotvrdený. Denisa + Ľuboš Baran majú synov Ľuboša a Roberta. Rovnomenní otcovia a synovia sú samostatné osoby; priezviská detí následne výslovne potvrdil používateľ (S037), dátumy zatiaľ neboli oznámené.",status:"Doplnené rodinné podanie S034"},{id:"Q014",title:"Helena / Elena a Sylvia",detail:"Rodina uviedla dcéru Sylviu Offei Kwatya, vydatú v UK, a potvrdila, že otec bol lekár. Meno a dátumy Ing. Eleny Salinkovej z malackého náhrobku treba porovnať s dokladom Heleny. Meno manžela Sylvie a ďalší súrodenci nezistení.",status:"Doplnená dcéra · meno matky v dokladoch otvorené"},{id:"Q015",title:"Nové pátranie · rodné priezviská tetiek",detail:"13. 10. 2026: sedem konkrétnych anonymných dotazov verejného indexu Cintoriny.sk. Malacky + Salink: Jozef 1949–2022 a Elena 1949–1999. Rodné priezvisko Ďuriš + Elena: 2 záznamy, Helena: 12 vrátane Ďurišinová, Ružena: 0, Marcela: 0; žiadny záznam neprepája Helenu s Elenou Salinkovou. Bratislava + Solár + Jozef: dvaja menovci 1904–1965 a 1913–nezistené, bez dôkazu väzby k Marcele. Veľká Čalomija + Okolensk: 0. Index je neúplný; počet výsledkov nepreukazuje životný stav ani nepríbuznosť. Nové osoby nepripojené. Ruženin manžel a syn majú zatiaľ nezistené priezvisko. Celé meno Sylvie a kombinácie mien tetiek vo všeobecnom vyhľadávaní neposkytli použiteľnú novú väzbu. Podrobnosti a hranice hľadania sú vo výskumnej správe na GitHube.",status:"Preverené indexy · ďalšia rodinná väzba zatiaľ nedoložená"},{id:"Q016",title:"Rodiny sestier Márie a Blanky",detail:"S039–S040: Mária Ševčíková P005, rod. Ďurišová, má manžela Jozefa Ševčíka P032 a deti Tobiasa Ševčíka P033 a Lucasa Ševčíka P034. Blanka Ďurišová P004 je slobodná a má dcéru Patríciu Rajčokovú P035. Priezviská detí potvrdil používateľ (S042); dátumy a otcovstvo zatiaľ nepotvrdené. Údaje sú rodinné podanie.",status:"Mená doplnené používateľom · nezávislé overenie otvorené"}],sources:[{id:"S004",title:"Matrika Zvolenská Slatina",url:"https://www.zvolenskaslatina.sk/urad/matrika/",note:"Obec uvádza vydávanie výpisov členom rodiny. Podklad pre získanie dokladu Viery; nevideli sme jej zápis.",checked:"2026-10-12"},{id:"S005",title:"Banská Bystrica · zbierky matrík",url:"https://www.minv.sk/?zoznam-zbierok",note:"Overený zoznam uvádza Zbierku cirkevných matrík (1377) a zbierky prvopisov i druhopisov v pracovisku Zvolen. Rozsah konkrétnej knihy a signatúra zatiaľ nezistené.",checked:"2026-10-12"},{id:"S006",title:"Archív Michalovce · územná pôsobnosť",url:"https://www.minv.sk/?sake-pmi-uzemna-posobnost",note:"Oficiálna stránka výslovne uvádza okresy Michalovce a Sobrance. Pôsobnosť nenahrádza zistenie konkrétneho fondu.",checked:"2026-10-12"},{id:"S007",title:"Archív Michalovce · zachované dokumenty",url:"https://www.minv.sk/?sake-pmi-ake-dokumenty-u-nas-najdete",note:"Prehľad uvádza štátne matriky 1895–1906/1914 vo fondoch notárskych úradov a povojnové fondy národných výborov. Konkrétna kniha alebo spis rodiny ešte neboli čítané.",checked:"2026-10-12"},{id:"S008",title:"Cintorín Zvolenská Slatina · verejný index",url:"https://mobec.sk/zvolenskaslatina#cintorin",note:"Prehľadaný index zosnulých: prefix Kulich 58 záznamov, Ďuriš 5, Gašperík 0. Relevantné záznamy .371, .372 a .610 skontrolované aj na fotografiách náhrobkov. Rodné priezviská treba hľadať oddelene od súčasného priezviska.",checked:"2026-10-12"},{id:"S009",title:"Náhrobok Márie a Jozefa Kulichových",url:"https://mobec.sk/photos/zvolenska_slatina/258.jpg",note:"Hrob 1549, pôvodné číslo 676. AI prečítala mená, rodné priezvisko Gašparíková a životné dátumy; rodina potvrdila zhodu úmrtí. Nie je to rodný ani sobášny matričný zápis.",checked:"2026-10-12"},{id:"S010",title:"Náhrobok Rudolfa Ďuriša",url:"https://mobec.sk/photos/zvolenska_slatina/408.jpg",note:"Hrob 240, pôvodné číslo 434. Index uvádza narodenie 12. 9. 1950 a úmrtie 26. 11. 2013; fotografia zodpovedá údajom a používateľ výslovne potvrdil totožnosť otca.",checked:"2026-10-12"},{id:"S017",title:"Cintoriny.sk · hľadanie otcových rodičov",url:"https://www.cintoriny.sk/src/index.php",note:"Verejné hľadanie: Rudolf Ďuriš 8, Alžbeta Ďurišová 15; prečítané detaily všetkých 15 Alžbiet. Rodné priezvisko Čakanová 0, Čekanová 1 (Sabinov). Žiadny záznam zatiaľ neidentifikovaný ako príbuzný. Hľadanie cintorína Sobrance bez výsledku je limitom tohto portálu.",checked:"2026-10-12"},{id:"S018",title:"Pohrebiska.sk · zoznam Košického kraja",url:"https://www.pohrebiska.sk/vyhladanie_sk_kraj_ma.jsp?kraj=KE",note:"Prečítaný zoznam evidovaných pohrebísk; Sobrance v zozname nie sú. Nejde o dôkaz, že Rudolf v Sobranciach nie je pochovaný. Osobné záznamy pre Sobrance tu neboli dostupné.",checked:"2026-10-12"},{id:"S019",title:"Rudolf a Alžbeta Ďurišovci · hrob C/148",url:"https://www.virtualnycintorin.sk/hrob/420333",note:"Detail hrobu skutočne prečítaný: Rudolf †30. 5. 1986, Alžbeta †12. 6. 2019. Používateľ dodal stopu a potvrdil Rudolfovo pochovanie v Sobranciach; fotografia uvádza narodenia a rodné priezvisko.",checked:"2026-10-12"},{id:"S020",title:"Náhrobok Rudolfa a Alžbety · dátumy a Čakanová",url:"https://www.virtualnycintorin.sk/obrazok/hm/FXMzMwNTIzMU8xNzQzNDUx",note:"AI prečítala Rudolf *10. 8. 1922 †30. 5. 1986; „a manželka Alžbeta rod. Čakanová“ *26. 1. 1925 †12. 6. 2019. Ide o náhrobok, nie rodný ani sobášny matričný zápis.",checked:"2026-10-12"},{id:"S021",title:"Juraj Ďuriš · nepriradený hrob C/25",url:"https://www.virtualnycintorin.sk/hrob/420210",note:"Náhrobok uvádza 1911–1991. Používateľ Juraja nepozná; nebol pridaný do rodiny. Rovnaké priezvisko a cintorín nedokazujú príbuzenstvo.",checked:"2026-10-13"},{id:"S022",title:"Juraj Ďuriš · fotografia náhrobku",url:"https://www.virtualnycintorin.sk/obrazok/hm/FXMjM4NTEzMU8xNTQwNDUx",note:"Pôvodná fotografia prečítaná AI: 1911–1991; žiadny nápis dokladajúci väzbu k Rudolfovi.",checked:"2026-10-13"},{id:"S024",title:"Cintoriny.sk · Jozef Kulich",url:"https://www.cintoriny.sk/src/index.php",note:"Verejný index vrátil 20 menovcov Jozef Kulich. Zodpovedajúci dátum 18. 10. 1919 / 16. 12. 1970 nezistený; Detva 23. 10. 1919 – 20. 3. 1999 je iný muž.",checked:"2026-10-13"},{id:"S025",title:"Praha · starý súpis obyvateľov",url:"https://katalog.ahmp.cz/pragapublica/",note:"V zbierke Soupis pražského obyvatelstva 1830–1910 (1920), xid 59F886CC3AA211E0824A00166F1163D4, dotazy Ďuriš, Duriš, Čakan a Kulich vrátili 0. Kontrolný prázdny dotaz zobrazil 270174 položiek. Nevylučuje neskorší pobyt rodiny v Prahe; osobná snímka nebola získaná.",checked:"2026-10-13"},{id:"S027",title:"Čierny Balog 1930 · Július Gašparík",url:"https://slovakiana.sk/scitacie-harky/cair-ko26xh3",note:"Hárok 1186/138 je obecný prehľad; Július Gašparík je uvedený ako sčítací revízor. Nie je doložený jeho vzťah k Márii Gašparíkovej. Katalóg obce má 903 položiek, nie 903 prečítaných rodinných hárkov.",checked:"2026-10-13"},{id:"S028",title:"Pozor na zaradenie · originál hárku Slatinky",url:"https://slovakiana.sk/scitacie-harky/cair-ko29ung",note:"Katalóg označuje 1257/75 ako Zvolenskú Slatinu, ale originál výslovne uvádza Slatinku. Výskum musí overovať obec na snímke. Dom 5 Slatinky (1141/326) neobsahuje hľadaného Jozefa 1919.",checked:"2026-10-13"},{id:"S029",title:"Jozefova matka a súrodenci · sčítanie 1930",url:"https://slovakiana.sk/scitacie-harky/cair-ko28dhx",note:"Originál hárku 1141/132, druhá strana: domácnosť 3, dom 197 Zvolenská Slatina. Mária Kulichová (1900), prednostka; Jozef, syn, 18. 10. 1919; Anna, dcéra, 1921; Ján, syn, 1924; Martin, syn, 1926. Rodisko pri všetkých Zvolenská Slatina. Zhoda Jozefovho mena a celého dátumu narodenia podporuje identifikáciu s P007. Poznámka „muž v Kanade“ neuvádza otca menom. Nie je to matričný zápis.",checked:"2026-10-13"},{id:"S032",title:"Hľadanie rodín tetiek · verejné indexy",url:"https://www.cintoriny.sk/src/index.php",note:"Cintoriny.sk: Helena Salinková 0, Marcela Solárová 0; Jozef Solár 12 výsledkov vrátane prefixových zhôd; Salinka 4 záznamy. Bez potvrdených mien ďalších detí. Virtuálny cintorín: Salinka Komárno 3 v jednom hrobe, Salinková 0. Bing vracal nesúvisiace výsledky a nepoužíva sa ako dôkaz neprítomnosti rodiny.",checked:"2026-10-13"},{id:"S033",title:"Malacky · MUDr. Jozef a Ing. Elena Salinkovci",url:"https://www.cintoriny.sk/src/index.php?cintorinId=1198&hrobId=1198000618",note:"Karta hrobu1198000618: MUDr. Jozef Salinka 3.1.1949–19.12.2022 a Ing. Elena Salinkova 19.5.1949–22.4.1999. Rodina následne potvrdila, že Helenin manžel bol lekár, čo s menom a Malackami podporuje identifikáciu Jozefa. Fotografia uvádza len Elenu; Helena/Elena ostáva nevyjasnené a jej dátumy neboli prebraté do profilu. Verejná kronika neuvádza deti; Sylvia je osobitné rodinné podanie S035.",checked:"2026-10-13"},{id:"S036",title:"Oprava Pavlových rodičov · otcova vetva",url:"https://github.com/pierresk1611/zpoledomu/blob/main/docs/manzelia-a-deti.md",note:"S036 — Používateľ 13. 10. 2026 opravil zaradenie Pavla P024: syn Ruženy P011 a jej manžela Pavla P019, otcova vetva. Rodinné podanie; bez nezávislého matričného dokladu.",checked:"2026-10-13"},{id:"S037",title:"Potvrdené priezviská detí a sestier",url:"https://github.com/pierresk1611/zpoledomu/blob/main/docs/manzelia-a-deti.md",note:"S037 — Používateľ 13. 10. 2026 výslovne potvrdil priezviská: Patrik Okolenský, Vanesa Okolenská, Ľuboš Baran, Robert Baran, Blanka Ďurišová a Mária Ďurišová. Rodinné podanie; bez nezávislého matričného dokladu.",checked:"2026-10-13"},{id:"S038",title:"Nové hľadanie rodín tetiek · rodné priezviská a lokality",url:"https://www.cintoriny.sk/src/index.php?simpleSearch&type=1&city=Malacky&surname=Salink",note:"13. 10. 2026: sedem konkrétnych anonymných dotazov verejného indexu Cintoriny.sk. Malacky + Salink: Jozef 1949–2022 a Elena 1949–1999. Rodné priezvisko Ďuriš + Elena: 2 záznamy, Helena: 12 vrátane Ďurišinová, Ružena: 0, Marcela: 0; žiadny záznam neprepája Helenu s Elenou Salinkovou. Bratislava + Solár + Jozef: dvaja menovci 1904–1965 a 1913–nezistené, bez dôkazu väzby k Marcele. Veľká Čalomija + Okolensk: 0. Index je neúplný; počet výsledkov nepreukazuje životný stav ani nepríbuznosť. Nové osoby nepripojené.",checked:"2026-10-13"},{id:"S039",title:"Rodiny sestier Márie a Blanky · rodinné podanie",url:"https://github.com/pierresk1611/zpoledomu/blob/main/docs/rodiny-sestier.md",note:"Používateľ 14. 10. 2026 uviedol: sestra Mária je vydatá a má dve deti; sestra Blanka je slobodná a má dcéru. Mená manžela a detí, Máriino priezvisko po vydaji, dátumy a otcovstvo detí zatiaľ neboli uvedené. Ide o rodinné podanie, nie nezávislé overenie.",checked:"2026-10-14"},{id:"S040",title:"Mená manžela a detí sestier",url:"https://github.com/pierresk1611/zpoledomu/blob/main/docs/rodiny-sestier.md",note:"S040 — Používateľ 14. 10. 2026 uviedol Máriino priezvisko Ševčíková, manžela Jozefa Ševčíka, deti Tobiasa a Lucasa a Blankinu dcéru Patríciu. Rodinné podanie; bez nezávislého dokladu.",checked:"2026-10-14"},{id:"S041",title:"Bydliská sestier · rodinné podanie",url:"https://github.com/pierresk1611/zpoledomu/blob/main/docs/rodiny-sestier.md",note:"Používateľ 14. 10. 2026 uviedol, že Mária žije v Hodruši-Hámroch a Blanka vo Zvolene. Obce pobytu nie sú dôkazom rodiska.",checked:"2026-10-14"},{id:"S042",title:"Priezviská detí sestier · potvrdené používateľom",url:"https://github.com/pierresk1611/zpoledomu/blob/main/docs/rodiny-sestier.md",note:"S042 — Používateľ potvrdil priezviská: Patrícia Rajčoková, Tobias Ševčí
