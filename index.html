g","from":"P004","to":"P005","kind":"unknown","source":"Vzťah uvedený používateľom (S001–S003); zatiaľ bez listinného dokladu.","status":"NEOVERENÉ"},{"id":"L014","type":"sibling","from":"P002","to":"P010","kind":"unknown","source":"S013 — Používateľ uviedol, že Viera má sestru Máriu.","status":"NEOVERENÉ"},{"id":"L015","type":"sibling","from":"P003","to":"P011","kind":"unknown","source":"S014 — Mená a pobyty oznámené používateľom v rozhovore, 12. 10. 2026; bez nezávislého dokladu.","status":"NEOVERENÉ"},{"id":"L016","type":"sibling","from":"P003","to":"P012","kind":"unknown","source":"S014 — Mená a pobyty oznámené používateľom v rozhovore, 12. 10. 2026; bez nezávislého dokladu.","status":"NEOVERENÉ"},{"id":"L017","type":"sibling","from":"P003","to":"P013","kind":"unknown","source":"S014 — Mená a pobyty oznámené používateľom v rozhovore, 12. 10. 2026; bez nezávislého dokladu.","status":"NEOVERENÉ"}],"questions":[{"id":"Q001","title":"Materská vetva · Čierny Balog","detail":"Máriu (1921–1983), rod. Gašparíkovú, a Jozefa (1919–1970) sme identifikovali na základe indexu, náhrobku a potvrdenia rodiny. Nasleduje zistenie ich rodičov z rodného alebo sobášneho zápisu; Čierny Balog je zatiaľ doložený iba rodinným podaním.","status":"Prvé nálezy podložené"},{"id":"Q002","title":"Otcovská vetva · Sobrance a Česko","detail":"Rudolf (1950–2013) bol identifikovaný podľa presného dátumu narodenia, náhrobku a potvrdenia syna. Rodisko Plzeň aj rodné priezvisko Alžbety Čakanová/Čekanová ostávajú neisté. Predkov Rudolfa zatiaľ dokladá rodinné podanie.","status":"Totožnosť otca potvrdená"},{"id":"Q003","title":"Adoptívne väzby sestier","detail":"Mária: opravený rok 1983. Obe sestry adoptovali Viera a Rudolf, odhadom v rokoch 1986/1987. Biologickí rodičia zatiaľ nie sú uvedení.","status":"Doplnené používateľom"},{"id":"Q004","title":"Súrodenci rodičov","detail":"Viera má sestru Máriu Maľovú (Zvolenská Slatina). Používateľ opravil počet: Rudolf mal tri sestry, Ruženu (Praha), Marcelu Solárovú (Bratislava) a Helenu Salinkovú (predtým Malacky). Pridané sú oznámené súrodenecké väzby; ich rodičov ani dátumy z týchto údajov neodvodzujeme.","status":"Doplnené rodinné údaje"},{"id":"Q005","title":"Narodenia a úmrtia otcových rodičov","detail":"Hľadáme dátumy narodenia a úmrtia Rudolfa Ďuriša staršieho a Alžbety (možno Čakanová/Čekanová). Rodina potvrdila Rudolfovo pochovanie v Sobranciach. Cintoriny.sk: 8 menovcov Rudolf Ďuriš a 15 Alžbiet Ďurišových, detaily 15 záznamov skontrolované; žiadna totožnosť zatiaľ potvrdená. Sobrance neboli nájdené vo vyhľadávaní cintoriny.sk ani v zozname pohrebísk Košického kraja na pohrebiska.sk. Web mesta vyžaduje CAPTCHA. Dátumy starých rodičov zostávajú otvorené.","status":"Prehľadané dostupné indexy · bez potvrdenej zhody"}],"sources":[{"id":"S004","title":"Matrika Zvolenská Slatina","url":"https://www.zvolenskaslatina.sk/urad/matrika/","note":"Obec uvádza vydávanie výpisov členom rodiny. Podklad pre získanie dokladu Viery; nevideli sme jej zápis.","checked":"2026-10-12"},{"id":"S005","title":"Banská Bystrica · zbierky matrík","url":"https://www.minv.sk/?zoznam-zbierok","note":"Overený zoznam uvádza Zbierku cirkevných matrík (1377) a zbierky prvopisov i druhopisov v pracovisku Zvolen. Rozsah konkrétnej knihy a signatúra zatiaľ nezistené.","checked":"2026-10-12"},{"id":"S006","title":"Archív Michalovce · územná pôsobnosť","url":"https://www.minv.sk/?sake-pmi-uzemna-posobnost","note":"Oficiálna stránka výslovne uvádza okresy Michalovce a Sobrance. Pôsobnosť nenahrádza zistenie konkrétneho fondu.","checked":"2026-10-12"},{"id":"S007","title":"Archív Michalovce · zachované dokumenty","url":"https://www.minv.sk/?sake-pmi-ake-dokumenty-u-nas-najdete","note":"Prehľad uvádza štátne matriky 1895–1906/1914 vo fondoch notárskych úradov a povojnové fondy národných výborov. Konkrétna kniha alebo spis rodiny ešte neboli čítané.","checked":"2026-10-12"},{"id":"S008","title":"Cintorín Zvolenská Slatina · verejný index","url":"https://mobec.sk/zvolenskaslatina#cintorin","note":"Prehľadaný index zosnulých: prefix Kulich 58 záznamov, Ďuriš 5, Gašperík 0. Relevantné záznamy .371, .372 a .610 skontrolované aj na fotografiách náhrobkov. Rodné priezviská treba hľadať oddelene od súčasného priezviska.","checked":"2026-10-12"},{"id":"S009","title":"Náhrobok Márie a Jozefa Kulichových","url":"https://mobec.sk/photos/zvolenska_slatina/258.jpg","note":"Hrob 1549, pôvodné číslo 676. AI prečítala mená, rodné priezvisko Gašparíková a životné dátumy; rodina potvrdila zhodu úmrtí. Nie je to rodný ani sobášny matričný zápis.","checked":"2026-10-12"},{"id":"S010","title":"Náhrobok Rudolfa Ďuriša","url":"https://mobec.sk/photos/zvolenska_slatina/408.jpg","note":"Hrob 240, pôvodné číslo 434. Index uvádza narodenie 12. 9. 1950 a úmrtie 26. 11. 2013; fotografia zodpovedá údajom a používateľ výslovne potvrdil totožnosť otca.","checked":"2026-10-12"},{"id":"S017","title":"Cintoriny.sk · hľadanie otcových rodičov","url":"https://www.cintoriny.sk/src/index.php","note":"Verejné hľadanie: Rudolf Ďuriš 8, Alžbeta Ďurišová 15; prečítané detaily všetkých 15 Alžbiet. Rodné priezvisko Čakanová 0, Čekanová 1 (Sabinov). Žiadny záznam zatiaľ neidentifikovaný ako príbuzný. Hľadanie cintorína Sobrance bez výsledku je limitom tohto portálu.","checked":"2026-10-12"},{"id":"S018","title":"Pohrebiska.sk · zoznam Košického kraja","url":"https://www.pohrebiska.sk/vyhladanie_sk_kraj_ma.jsp?kraj=KE","note":"Prečítaný zoznam evidovaných pohrebísk; Sobrance v zozname nie sú. Nejde o dôkaz, že Rudolf v Sobranciach nie je pochovaný. Osobné záznamy pre Sobrance tu neboli dostupné.","checked":"2026-10-12"}],"seedRevision":2}</script><script>(function(){"use strict";function B0(s){return s&&s.__esModule&&Object.prototype.hasOwnProperty.call(s,"default")?s.default:s}var Ji={exports:{}},K={};/**

sť nenahrádza zistenie konkrétneho fondu.",checked:"2026-10-12"},{id:"S007",title:"Archív Michalovce · zachované dokumenty",url:"https://www.minv.sk/?sake-pmi-ake-dokumenty-u-nas-najdete",note:"Prehľad uvádza štátne matriky 1895–1906/1914 vo fondoch notárskych úradov a povojnové fondy národných výborov. Konkrétna kniha alebo spis rodiny ešte neboli čítané.",checked:"2026-10-12"},{id:"S008",title:"Cintorín Zvolenská Slatina · verejný index",url:"https://mobec.sk/zvolenskaslatina#cintorin",note:"Prehľadaný index zosnulých: prefix Kulich 58 záznamov, Ďuriš 5, Gašperík 0. Relevantné záznamy .371, .372 a .610 skontrolované aj na fotografiách náhrobkov. Rodné priezviská treba hľadať oddelene od súčasného priezviska.",checked:"2026-10-12"},{id:"S009",title:"Náhrobok Márie a Jozefa Kulichových",url:"https://mobec.sk/photos/zvolenska_slatina/258.jpg",note:"Hrob 1549, pôvodné číslo 676. AI prečítala mená, rodné priezvisko Gašparíková a životné dátumy; rodina potvrdila zhodu úmrtí. Nie je to rodný ani sobášny matričný zápis.",checked:"2026-10-12"},{id:"S010",title:"Náhrobok Rudolfa Ďuriša",url:"https://mobec.sk/photos/zvolenska_slatina/408.jpg",note:"Hrob 240, pôvodné číslo 434. Index uvádza narodenie 12. 9. 1950 a úmrtie 26. 11. 2013; fotografia zodpovedá údajom a používateľ výslovne potvrdil totožnosť otca.",checked:"2026-10-12"},{id:"S017",title:"Cintoriny.sk · hľadanie otcových rodičov",url:"https://www.cintoriny.sk/src/index.php",note:"Verejné hľadanie: Rudolf Ďuriš 8, Alžbeta Ďurišová 15; prečítané detaily všetkých 15 Alžbiet. Rodné priezvisko Čakanová 0, Čekanová 1 (Sabinov). Žiadny záznam zatiaľ neidentifikovaný ako príbuzný. Hľadanie cintorína Sobrance bez výsledku je limitom tohto portálu.",checked:"2026-10-12"},{id:"S018",title:"Pohrebiska.sk · zoznam Košického kraja",url:"https://www.pohrebiska.sk/vyhladanie_sk_kraj_ma.jsp?kraj=KE",note:"Prečítaný zoznam evidovaných pohrebísk; Sobrance v zozname nie sú. Nejde o dôkaz, že Rudolf v Sobranciach nie je pochovaný. Osobné záznamy pre Sobrance tu neboli dostupné.",checked:"2026-10-12"}],seedRevision:2,seedUpdates:[{revision:2,people:["P010","P011","P012","P013"],relationships:["L014","L015","L016","L017"],questions:["Q004","Q005"],appendNotes:[{personId:"P003",text:"Podľa opraveného údaja používateľa mal Rudolf tri sestry: Ruženu (Praha), Marcelu Solárovú (Bratislava) a Helenu Salinkovú (predtým Malacky). Pôvodný počet štyri bol opravený používateľom (S016)."},{personId:"P009",text:"Používateľ potvrdil pochovanie v Sobranciach (S015); životné dátumy a konkrétny hrob zatiaľ nepoznáme."}],sources:["S017","S018"]}]};/**
