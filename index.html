ka_slatina/408.jpg",note:"Hrob 240, pôvodné číslo 434. Index uvádza narodenie 12. 9. 1950 a úmrtie 26. 11. 2013; fotografia zodpovedá údajom a používateľ výslovne potvrdil totožnosť otca.",checked:"2026-10-12"}],seedRevision:1};/**
